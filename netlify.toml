[build]
  publish = "."

# Disable Netlify post-processing for HTML/CSS/JS. It can break third-party admin bundles (Decap)
# and inline scripts, causing subtle UI failures like non-clickable collection entries.
[build.processing]
  skip_processing = true

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
